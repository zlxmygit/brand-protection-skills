name: Verify and complete Skill v1.0.0

on:
  push:
    branches: ['release/v1.0.0']

permissions:
  contents: read

concurrency:
  group: publish-brand-protection-v1.0.0
  cancel-in-progress: false

jobs:
  validate:
    name: Release tests / Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python: ['3.9', '3.11', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 400e3a00710474d8a321dcd06b1148d910391609
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Run all 76 contracts, including 1120 field mutations
        run: python -B -m unittest discover -s tests -v

  publish:
    name: Verify published assets and add release documents
    needs: validate
    if: github.repository == 'zlxmygit/brand-protection-skills' && github.ref == 'refs/heads/release/v1.0.0'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 400e3a00710474d8a321dcd06b1148d910391609
          path: source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Verify published packages and supplement without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B .github/release-v1.0.0/verify_published.py
