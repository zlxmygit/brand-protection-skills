name: Queue contracts

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: queue-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python: ['3.9', '3.11', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run queue, CLI, audit and mutation contracts
        run: python -B -m unittest discover -s tests -v
      - name: Run bounded cross-module mutations and graph checks
        run: python -B tests/extended_v18_probes.py
