name: 功能建议 / Feature request
description: 建议可复用的流程、市场支持或工具能力。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        以通用场景描述需求，不提交真实品牌证据或个案委托。新增外发、调度或第三方服务能力需要说明权限与依赖。
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开信息检查
      options:
        - label: 本建议不含真实案件、私人资料或凭证。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 用户场景与现有缺口
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议行为与范围
      description: 涉及地区、渠道、权限或依赖时一并说明。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 如何判断完成
      description: 可观察结果、失败情况及兼容性要求。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方法或官方资料
